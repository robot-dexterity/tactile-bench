[project]
name = "tactile_bench"
version = "0.0.1"
description = "Robot learning suite for tactile robotics"
readme = "README.md"
requires-python = "==3.9.*"

license = { text = "MIT" } 
authors = [
  { name = "Nathan Lepora, Yijiong Lin, Harry Field, Bowen Deng, Richard Lane", email = "n.lepora@bristol.ac.uk" },
]

dependencies = [
    "hydra-core>=1.3.2",
    "matplotlib",
    "numpy<=1.21.2", # works in 3.8 and 3.9
    "opencv-python>=4.5.1",
    "pandas",
    "pynput",
    "pyyaml>=6.0.2",
    "scikit-learn",
    "scikit-image>=0.19.3",
    "seaborn",
    "transforms3d",
    "tqdm",
    "common-robot-interface[sim]",
    "tactile-sim"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
common-robot-interface = { path = "../common-robot-interface", editable = true }
tactile-sim = { path = "../tactile-sim", editable = true }
