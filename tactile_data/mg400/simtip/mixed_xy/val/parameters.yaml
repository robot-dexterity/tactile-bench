backend:
  env: {embodiment_type: tactile_arm, physics_rate: 240, show_gui: false, show_tactile: false,
    solver_iterations: 300}
  name: sim
collect:
  data_dirs: [train, val]
  experiment: mg400/simtip/mixed_xy
  name: mixed_xy
  num_samples: [100, 20]
  object_poses:
    cone: [-25, -75, 0, 0, 0, 0]
    cross_lines: [-25, -50, 0, 0, 0, 0]
    curved_surface: [-25, -25, 0, 0, 0, 0]
    cylinder: [-25, 0, 0, 0, 0, 0]
    cylinder_shell: [-25, 25, 0, 0, 0, 0]
    cylinder_side: [-25, 50, 0, 0, 0, 0]
    dot_in: [-25, 75, 0, 0, 0, 0]
    dots: [0, -75, 0, 0, 0, 0]
    flat_slab: [0, -50, 0, 0, 0, 0]
    hexagon: [0, -25, 0, 0, 0, 0]
    line: [0, 0, 0, 0, 0, 0]
    moon: [0, 25, 0, 0, 0, 0]
    pacman: [0, 50, 0, 0, 0, 0]
    parallel_lines: [0, 75, 0, 0, 0, 0]
    prism: [25, -75, 0, 0, 0, 0]
    random: [25, -50, 0, 0, 0, 0]
    sphere1: [25, -25, 0, 0, 0, 0]
    sphere2: [25, 0, 0, 0, 0, 0]
    torus: [25, 25, 0, 0, 0, 0]
    triangle: [25, 50, 0, 0, 0, 0]
    wave: [25, 75, 0, 0, 0, 0]
  pose_lims:
  - [-5, -5, -1, 0, 0, 0]
  - [5, 5, 1, 0, 0, 0]
  robot: mg400
  sim:
    arm_type: mg400
    stim_name: mixed_probes
    stim_pose: [300, 0, 12.5, 0, 0, 0]
    tcp_pose: [0, 0, -85, 0, 0, 0]
    work_frame: [300, 0, 25, -180, 0, -180]
  stim_name: mixed_probes
  transfer: null
globals:
  IMAGE: tactile_images
  OBJECT_CLASS: class
  OBJECT_POSE: [object_x, object_y, object_z, object_Rx, object_Ry, object_Rz]
  POSE: [pose_x, pose_y, pose_z, pose_Rx, pose_Ry, pose_Rz]
  REFERENCE: 0
sensor:
  image_size: [256, 256]
  name: simtip
  sim:
    depth: {npz: null, png: uint8}
    image_size: [256, 256]
    sensor_type: standard_tactip
    turn_off_border: false
settings: {device: cpu, overwrite_on: true, path: tactile_data, restore_on: true,
  seed: 42}
